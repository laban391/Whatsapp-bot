<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOON Owner Dashboard</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e8ecf5;font:15px system-ui;padding:20px}.wrap{max-width:1000px;margin:auto}input,button{padding:12px;border-radius:8px;border:1px solid #39445f;background:#151e33;color:white}button{cursor:pointer;background:#635bdb}button:disabled{opacity:.5;cursor:wait}.danger{background:#a52836;border-color:#c13a48}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.card{background:#151e33;padding:16px;border-radius:12px;margin:12px 0;overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:650px}td,th{text-align:left;padding:10px;border-bottom:1px solid #303b55}small,.muted{color:#9ba8c4}.actions{display:flex;gap:7px;flex-wrap:wrap}.status{white-space:nowrap}
</style></head><body><div class="wrap"><h1>MOON · Owner dashboard</h1><p><small>Enter your ADMIN_TOKEN. It is used only for requests from this page.</small></p>
<div class="bar"><input id="token" type="password" placeholder="ADMIN_TOKEN" autocomplete="current-password" style="flex:1;min-width:200px"><button id="load" onclick="loadData()">Load sessions</button></div>
<div id="notice" class="muted" role="status"></div><div id="summary"></div>
<div class="card"><table><thead><tr><th>WhatsApp number</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="4">Authenticate to load sessions.</td></tr></tbody></table></div>
<p class="muted"><small>Delete permanently removes the user's account record and saved WhatsApp authentication keys. The user must pair again to use the bot.</small></p></div>
<script>
const tokenInput=document.getElementById('token');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function headers(){return {'content-type':'application/json','x-admin-token':tokenInput.value};}
async function api(url,options={}){const r=await fetch(url,{...options,headers:{...headers(),...(options.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d;}
async function loadData(){const b=document.getElementById('load');b.disabled=true;document.getElementById('notice').textContent='Loading…';try{const d=await api('/api/admin/sessions');document.getElementById('summary').innerHTML=`<div class="card">Users: <b>${Number(d.total)||0}</b> · Active sockets: <b>${Number(d.active)||0}</b></div>`;document.getElementById('rows').innerHTML=(d.sessions||[]).map(s=>{const id=String(s.userId||'');const status=s.isConnected?'Connected':(s.connectionState==='connecting'?'Connecting':'Offline');return `<tr><td>${esc(s.phoneNumber||id)}</td><td class="status">${status}</td><td>${esc(s.createdAt||'')}</td><td><div class="actions"><button data-action="disconnect" data-user="${esc(id)}">Disconnect</button><button class="danger" data-action="delete" data-user="${esc(id)}">Delete user + session</button></div></td></tr>`}).join('')||'<tr><td colspan="4">No sessions yet.</td></tr>';document.getElementById('notice').textContent='Sessions loaded.';}catch(e){document.getElementById('notice').textContent=e.message;}finally{b.disabled=false;}}
document.getElementById('rows').addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const userId=b.dataset.user;if(b.dataset.action==='delete'){if(!confirm(`Permanently delete ${userId} and erase their saved WhatsApp session? They will need to pair again. This cannot be undone.`))return;b.disabled=true;try{const d=await api('/api/admin/delete-user',{method:'POST',body:JSON.stringify({userId})});document.getElementById('notice').textContent=d.message||'User deleted.';await loadData();}catch(err){document.getElementById('notice').textContent=err.message;b.disabled=false;}return;}b.disabled=true;try{const d=await api('/api/admin/disconnect',{method:'POST',body:JSON.stringify({userId})});document.getElementById('notice').textContent=d.message||'Disconnected.';await loadData();}catch(err){document.getElementById('notice').textContent=err.message;b.disabled=false;}});
</script></body></html>
