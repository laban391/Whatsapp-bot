<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOON Owner Dashboard</title><style>body{margin:0;background:#0b1020;color:#e8ecf5;font:15px system-ui;padding:24px}.wrap{max-width:900px;margin:auto}input,button{padding:12px;border-radius:8px;border:1px solid #39445f;background:#151e33;color:white}button{cursor:pointer;background:#635bdb}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.card{background:#151e33;padding:16px;border-radius:12px;margin:12px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #303b55}small{color:#9ba8c4}</style></head><body><div class="wrap"><h1>MOON · Owner dashboard</h1><p><small>Enter your ADMIN_TOKEN. It is used only for requests from this page.</small></p><div class="bar"><input id="token" type="password" placeholder="ADMIN_TOKEN" style="flex:1"><button onclick="loadData()">Load sessions</button></div><div id="summary"></div><div class="card"><table><thead><tr><th>WhatsApp number</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="4">Authenticate to load sessions.</td></tr></tbody></table></div></div><script>async function loadData(){const t=document.getElementById('token').value;const r=await fetch('/api/admin/sessions',{headers:{'x-admin-token':t}});const d=await r.json();if(!r.ok){alert(d.error||'Request failed');return}document.getElementById('summary').innerHTML=`<div class="card">Users: <b>${d.total}</b> · Active sockets: <b>${d.active}</b></div>`;document.getElementById('rows').innerHTML=d.sessions.map(s=>`<tr><td>${s.phoneNumber}</td><td>${s.isConnected?'Connected':(s.connectionState==='connecting'?'Connecting':'Offline')}</td><td>${s.createdAt||''}</td><td><button onclick="disconnect('${s.userId}')">Disconnect</button></td></tr>`).join('')||'<tr><td colspan="4">No sessions yet.</td></tr>'}async function disconnect(userId){const r=await fetch('/api/admin/disconnect',{method:'POST',headers:{'content-type':'application/json','x-admin-token':document.getElementById('token').value},body:JSON.stringify({userId})});const d=await r.json();if(!r.ok)alert(d.error||'Failed');else alert(d.message||'Disconnected');loadData()}</script></body></html>
